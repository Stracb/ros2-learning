# ROS 2 ←→ Gazebo 话题桥接清单
#
# 每一项是一个桥接规则，四条信息：
#   ros_topic_name : ROS 2 侧的话题名
#   gz_topic_name  : Gazebo 侧的话题名
#   ros_type_name  : ROS 2 侧的消息类型
#   gz_type_name   : Gazebo 侧的消息类型
#   direction      : 方向 —— ROS_TO_GZ / GZ_TO_ROS / BIDIRECTIONAL

# ① 速度指令：ROS 2 发 → Gazebo 收（驱动轮子）
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# ② 里程计：Gazebo 发 → ROS 2 收（回传"我走到哪了"）
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# ③ 激光雷达：Gazebo 发 → ROS 2 收（单向！）
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# ④ 关节状态：Gazebo 发 → ROS 2 收（rsp 靠它算出轮子的 TF）
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ⑤ 坐标变换：Gazebo 发 → ROS 2 收（odom → base_link 就是它发的）
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS